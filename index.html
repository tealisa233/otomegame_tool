<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女遊戲男主匹配推薦系統</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --primary: #ff6b8b;
      --primary-hover: #ff4770;
      --bg-gradient: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.6);
      --text-main: #2d1a32;
      --text-muted: #6b5270;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* 夢幻背景動態星空與心形浮動 */
    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-shape {
      position: absolute;
      opacity: 0.6;
      animation: floatAnim 10s infinite ease-in-out;
    }

    @keyframes floatAnim {
      0% { transform: translateY(105vh) rotate(0deg) scale(0.8); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
    }

    /* 玻璃擬態核心卡片 */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid var(--glass-border);
      box-shadow: 0 20px 50px rgba(166, 110, 150, 0.25);
      border-radius: 28px;
    }

    /* 16:9 專用橫向 CG 框 (Aspect Ratio Guardrail) */
    .cg-frame-16-9 {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #ffe3ec 0%, #e2e8f0 100%);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.05), 0 8px 20px rgba(255, 107, 139, 0.2);
      border: 3px solid #ffffff;
    }

    .cg-frame-16-9 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.6s ease;
    }

    .cg-frame-16-9:hover img {
      transform: scale(1.04);
    }

    /* 按鈕與互動視覺 */
    .btn-heart {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px rgba(255, 117, 140, 0.35);
    }

    .btn-heart:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 117, 140, 0.5);
    }

    .btn-heart:active {
      transform: translateY(1px);
    }

    .option-card {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #f3e8f4;
      transition: all 0.25s ease;
    }

    .option-card:hover {
      border-color: #ff758c;
      background: #fff5f8;
      transform: translateX(4px);
    }

    /* 淡入切換動畫 */
    .view-transition {
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    /* 自訂 Alert Toast */
    #toast {
      visibility: hidden;
      min-width: 200px;
      background-color: #2d1a32;
      color: #fff;
      text-align: center;
      border-radius: 50px;
      padding: 12px 24px;
      position: fixed;
      z-index: 99;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    #toast.show {
      visibility: visible;
      animation: fadeInOut 2.5s;
    }

    @keyframes fadeInOut {
      0% { bottom: 10px; opacity: 0; }
      20% { bottom: 30px; opacity: 1; }
      80% { bottom: 30px; opacity: 1; }
      100% { bottom: 10px; opacity: 0; }
    }
  </style>
</head>

        options: [
          { text: "「無論前方有多危險，只要你回頭，我永遠都在你身後。」", score: { xia_yan: 4, shen_xinghui: 2 } },
          { text: "「世界很大，但我的眼睛裡，從頭到尾只有你一個人。」", score: { shen_xinghui: 3, qi_yu: 3 } },
          { text: "「在我面前，你不需要逞強，一切都有我在。」", score: { zuo_ran: 3, li_shen: 3 } },
          { text: "「這場局的主導權在你，但你的心，只能屬於我。」", score: { qin_che: 4, lu_jinghe: 2 } },
          { text: "「不要離開我的視線……只要能保護你，我甘願付出任何代價。」", score: { xia_yizhou: 4, mo_yi: 2 } }
        ]
      }
    ];

    let currentQuestionIndex = 0;
    let scores = {};
    let matchedCharacter = null;

    // DOM 元素引用
    const startView = document.getElementById('startView');
    const quizView = document.getElementById('quizView');
    const resultView = document.getElementById('resultView');

    const btnStart = document.getElementById('btnStart');
    const btnRestart = document.getElementById('btnRestart');
    const btnCopy = document.getElementById('btnCopy');

    // 重新初始化分數
    function resetScores() {
      scores = {
        xia_yan: 0, zuo_ran: 0, mo_yi: 0, lu_jinghe: 0,
        shen_xinghui: 0, li_shen: 0, qi_yu: 0, qin_che: 0, xia_yizhou: 0
      };
    }

    // 視圖切換
    function switchView(targetView) {
      [startView, quizView, resultView].forEach(view => {
        if (view === targetView) {
          view.classList.remove('hidden');
          setTimeout(() => view.style.opacity = '1', 20);
        } else {
          view.style.opacity = '0';
          view.classList.add('hidden');
        }
      });
    }

    // 渲染題目
    function renderQuestion() {
      const q = QUESTIONS[currentQuestionIndex];
      const total = QUESTIONS.length;

      document.getElementById('quizStepBadge').textContent = `QUESTION 0${currentQuestionIndex + 1}`;
      document.getElementById('quizProgressText').textContent = `${currentQuestionIndex + 1} / ${total}`;
      document.getElementById('progressBar').style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;
      document.getElementById('questionTitle').textContent = q.title;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const optionBtn = document.createElement('button');
        optionBtn.className = 'option-card w-full p-4 rounded-2xl text-left text-sm font-medium text-purple-950 flex items-center justify-between cursor-pointer';
        optionBtn.innerHTML = `
          <span class="leading-relaxed pr-2">${opt.text}</span>
          <svg class="w-5 h-5 text-pink-400 shrink-0 opacity-0 transition-opacity group-hover:opacity-100" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        `;

        optionBtn.onclick = () => {
          // 加分邏輯
          for (const key in opt.score) {
            scores[key] = (scores[key] || 0) + opt.score[key];
          }

          currentQuestionIndex++;
          if (currentQuestionIndex < total) {
            renderQuestion();
          } else {
            calculateAndShowResult();
          }
        };

        container.appendChild(optionBtn);
      });
    }

    // 計算匹配結果
    function calculateAndShowResult() {
      let maxScore = -1;
      let winnerKey = 'shen_xinghui';

      for (const key in scores) {
        if (scores[key] > maxScore) {
          maxScore = scores[key];
          winnerKey = key;
        }
      }

      matchedCharacter = CHARACTERS[winnerKey];
      // 動態匹配百分比 (89% - 99%)
      const matchRate = Math.min(99, Math.max(89, 88 + Math.floor(maxScore * 0.8)));

      // 填充結果頁面資訊
      document.getElementById('resultGame').textContent = matchedCharacter.game;
      document.getElementById('resultName').textContent = matchedCharacter.name;
      document.getElementById('resultMatchRate').textContent = `${matchRate}%`;
      document.getElementById('resultReason').textContent = matchedCharacter.reason;

      // 渲染性格標籤
      const tagsContainer = document.getElementById('resultTags');
      tagsContainer.innerHTML = '';
      matchedCharacter.tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'px-2.5 py-1 rounded-lg bg-pink-100/80 text-pink-700 text-xs font-semibold';
        span.textContent = `#${tag}`;
        tagsContainer.appendChild(span);
      });

      // 16:9 CG 圖片區域 (具備強大向量備援 Fallback)
      const cgContainer = document.getElementById('cgContainer');
      cgContainer.innerHTML = `
        <img src="${matchedCharacter.img}" alt="${matchedCharacter.name}" 
             onerror="renderFallbackIllustration(this, '${matchedCharacter.name}', '${matchedCharacter.game}')" />
      `;

      switchView(resultView);
    }

    // 向量圖案備援繪製（確保無圖片時依舊顯示 16:9 美圖）
    function renderFallbackIllustration(imgElement, name, game) {
      const parent = imgElement.parentElement;
      parent.innerHTML = `
        <div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-pink-300 via-purple-200 to-indigo-300 text-purple-950 p-4 relative overflow-hidden">
          <div class="absolute -right-6 -bottom-6 opacity-20 transform rotate-12">
            <svg class="w-48 h-48 fill-current text-white" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <div class="relative z-10 text-center">
            <span class="inline-block px-3 py-0.5 rounded-full bg-white/60 text-purple-900 text-xs font-bold mb-2 shadow-sm">${game}</span>
            <h4 class="text-2xl font-black tracking-wider text-purple-950 drop-shadow-sm">${name}</h4>
            <p class="text-xs text-purple-800/80 mt-1">16:9 專屬命定橫版 CG 展示</p>
          </div>
        </div>
      `;
    }

    // 複製結果到剪貼簿
    function copyResult() {
      if (!matchedCharacter) return;
      const text = `【乙女遊戲男主匹配測驗】\n我測出的命定男主角是《${matchedCharacter.game}》的「${matchedCharacter.name}」！\n匹配契合度高達 ${document.getElementById('resultMatchRate').textContent}！\n快來測測看誰是你的命定男主吧！`;

      const tempInput = document.createElement('textarea');
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast('分析結果已成功複製到剪貼簿！');
      } catch (err) {
        showToast('複製失敗，請手動選取文字');
      }
      document.body.removeChild(tempInput);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'show';
      setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 2500);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // 綁定按鈕事件
      btnStart.addEventListener('click', () => {
        currentQuestionIndex = 0;
        resetScores();
        switchView(quizView);
        renderQuestion();
      });

      btnRestart.addEventListener('click', () => {
        switchView(startView);
      });

      btnCopy.addEventListener('click', copyResult);

      // 動態產生背景愛心與星星元素
      const bgDecor = document.getElementById('bgDecor');
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-shape';
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${7 + Math.random() * 6}s`;
        heart.style.animationDelay = `${Math.random() * 5}s`;
        
        const size = 12 + Math.random() * 18;
        heart.innerHTML = `
          <svg style="width:${size}px; height:${size}px; fill:rgba(255, 255, 255, 0.5);" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        `;
        bgDecor.appendChild(heart);
      }
    });
  </script>
</body>
</html>
